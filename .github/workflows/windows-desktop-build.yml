name: Windows Desktop - Seek Fix Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for this test build"
        required: true
        default: "1.8.0-seek-fix"

permissions:
  contents: read

concurrency:
  group: windows-seek-fix-build
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 - Test and MSI
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install WiX Toolset 3
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath "$env:RUNNER_TEMP\wix"
          "$env:RUNNER_TEMP\wix" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify native build tools
        shell: pwsh
        run: |
          cmake --version
          where.exe cl
          cl /?

      - name: Write local.properties
        shell: pwsh
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          "LASTFM_API_KEY=$env:LASTFM_API_KEY" | Out-File local.properties -Encoding utf8
          "LASTFM_SECRET=$env:LASTFM_SECRET" | Out-File local.properties -Append -Encoding utf8

      - name: Run desktop tests
        shell: pwsh
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: |
          .\gradlew.bat :shared:jvmTest :desktopApp:test "-Pbitchord.version=$env:BUILD_VERSION"

      - name: Build Windows MSI
        shell: pwsh
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: |
          .\gradlew.bat :desktopApp:packageMsi :desktopApp:createDistributable "-Pbitchord.version=$env:BUILD_VERSION"

      - name: Verify packaged SMTC DLL and seek callback
        shell: pwsh
        run: |
          $jarPath = "desktopApp/build/compose/binaries/main/app/Muses/app"
          $jar = Get-ChildItem $jarPath -Filter "desktopApp*.jar" |
            Select-Object -First 1

          if (-not $jar) {
            throw "Desktop application JAR not found."
          }

          $entries = & jar tf $jar.FullName

          if ($entries -notcontains "native/bitchord_smtc.dll") {
            throw "Windows SMTC DLL is missing from the application JAR."
          }

          $temp = Join-Path $env:RUNNER_TEMP "smtc-check"
          New-Item -ItemType Directory -Force $temp | Out-Null

          Push-Location $temp
          & jar xf $jar.FullName "native/bitchord_smtc.dll"
          Pop-Location

          $dll = Join-Path $temp "native/bitchord_smtc.dll"
          $bytes = [System.IO.File]::ReadAllBytes($dll)
          $contents = [System.Text.Encoding]::ASCII.GetString($bytes)

          if ($contents -notmatch "onSeek") {
            throw "SMTC DLL does not contain the onSeek callback."
          }

          Write-Host "SMTC DLL and onSeek callback verified."

      - name: Collect MSI
        shell: pwsh
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null

          $msi = Get-ChildItem `
            "desktopApp/build/compose/binaries/main/msi" `
            -Filter "*.msi" |
            Select-Object -First 1

          if (-not $msi) {
            throw "MSI installer was not generated."
          }

          Copy-Item $msi.FullName "dist/Muses-$env:BUILD_VERSION-windows-x64.msi"

          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: Muses-Windows
          path: dist/*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Seek-Fix-Test-Reports
          path: |
            desktopApp/build/reports/tests/
            shared/build/reports/tests/
          if-no-files-found: ignore
